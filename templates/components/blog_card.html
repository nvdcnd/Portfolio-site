<article class="card site-card blog-card h-100">
  <div class="card-body d-flex flex-column">
    <div class="blog-meta d-flex flex-wrap align-items-center gap-2 mb-3">
      {% if post.category %}
        <span class="card-badge">{{ post.category.name }}</span>
      {% endif %}
      <span aria-hidden="true">•</span>
      <time datetime="{{ post.created_at|date:'Y-m-d' }}">{{ post.created_at|date:"M d, Y" }}</time>
    </div>
    <h3 class="card-title h4">{{ post.title }}</h3>
    <p class="card-text flex-grow-1">{{ post.content|striptags|truncatechars:160 }}</p>
    {% if post.tags.all %}
      <div class="blog-tags d-flex flex-wrap gap-2 mb-4">
        {% for tag in post.tags.all|slice:":4" %}
          <span>#{{ tag.name }}</span>
        {% endfor %}
      </div>
    {% endif %}
    <a class="btn-text mt-auto" href="{% url 'blog:index' %}" aria-label="Read articles including {{ post.title }}">
      Read Articles
      <i class="bi bi-arrow-right" aria-hidden="true"></i>
    </a>
  </div>
</article>
