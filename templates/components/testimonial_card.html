<article class="card site-card testimonial-card h-100">
  <div class="card-body d-flex flex-column">
    <div class="quote-icon mb-3" aria-hidden="true">
      <i class="bi bi-quote"></i>
    </div>
    <blockquote class="flex-grow-1 mb-4">
      <p>{{ testimonial.testimonial }}</p>
    </blockquote>
    <div class="reviewer-info d-flex align-items-center gap-3 pt-3">
      {% if testimonial.image %}
        <img src="{{ testimonial.image.url }}" alt="{{ testimonial.name }} profile photo" class="reviewer-avatar" loading="lazy">
      {% else %}
        <div class="reviewer-avatar reviewer-placeholder" aria-hidden="true">{{ testimonial.name|slice:":1" }}</div>
      {% endif %}
      <div>
        <h3 class="h6 mb-1">{{ testimonial.name }}</h3>
        <p class="mb-0">{{ testimonial.title }}{% if testimonial.company %}, {{ testimonial.company }}{% endif %}</p>
      </div>
    </div>
  </div>
</article>
